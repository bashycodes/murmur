# Windows shell (apps/murmur-windows): the real MSVC build, tests and the
# Tauri installers (MSI + NSIS) for two flavours:
#   * hybrid  = default features (this PC + your murmur-server + opt-in cloud
#               STT) + Parakeet, i.e. `--features app,parakeet`;
#   * client  = client-only, no network code linked
#               (`--no-default-features --features local,app,parakeet`).
# Both bundle whisper.cpp and Parakeet (sherpa-onnx + onnxruntime DLLs next
# to the exe) and the AI cleanup engine (llama.cpp plugin, D10) twice:
# murmur_llm_vulkan.dll (GPU through Vulkan; built with the LunarG Vulkan SDK)
# and murmur_llm.dll (CPU). The app loads the Vulkan one first and the CPU one
# when it does not load (no vulkan-1.dll); with no usable GPU the Vulkan
# one runs on the CPU itself. Whisper gets the same treatment (D42):
# murmur_whisper_vulkan.dll (whisper.cpp on the GPU through Vulkan) is loaded
# first; without vulkan-1.dll or a usable GPU the app uses its built-in CPU
# whisper. No secrets, no signing: the installers are unsigned, so
# SmartScreen warns on first run (README "Live test on Windows").
# A pushed tag vX.Y.Z (tools/release.sh, D26) also checks the tag against
# VERSION/CHANGELOG and attaches the installers to the GitHub release vX.Y.Z
# (their names already carry the version: Murmur_X.Y.Z_x64-setup_hybrid.exe).
name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [integration, win-final, "feat/**"]
    # Path filters are not evaluated for tag pushes: every release tag builds.
    tags: ["v*"]
    paths:
      - "apps/murmur-windows/**"
      - "crates/**"
      - "Cargo.lock"
      - "VERSION"
      - "tools/versioning/**"
      - "tools/check-version.sh"
      - "tools/check-build-matrix.sh"
      - ".github/workflows/windows-build.yml"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # whisper-rs-sys runs bindgen; windows-latest ships LLVM here.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  # LunarG Vulkan SDK for the GPU build of the AI cleanup engine (headers,
  # vulkan-1.lib, glslc). Bump with care: it is cached per version.
  VULKAN_VERSION: 1.4.363.0
  # whisper.cpp/ggml optimisation (docs/findings/2026-11-02-win-cpu-whisper-speed.md).
  # The `cmake` crate, with the Visual Studio generator, overwrites
  # CMAKE_<LANG>_FLAGS_RELEASE with cc's flags, which have no /O2
  # (cmake-rs#240), so through 1.0.0 whisper-rs-sys built ggml at MSVC's
  # default /Od: CPU whisper (the exe's built-in engine and the plugin's CPU
  # path) ran 6-18x slower than whisper-cli. whisper-rs-sys forwards every
  # CMAKE_* env var as a -D define, and a defined one is left alone, so these
  # restore CMake's own Release flags (/O2 /Ob2 /DNDEBUG); -MD matches Rust's
  # CRT. Dashes, not slashes: the MSYS bash of the run steps rewrites a
  # "/MD..." env value into a Windows path when it starts cargo. Only here,
  # not in .cargo/config.toml: gcc on Linux would reject them.
  # llama-cpp-sys-2 forwards them too and already adds the same flags itself.
  CMAKE_C_FLAGS_RELEASE: "-MD -O2 -Ob2 -DNDEBUG"
  CMAKE_CXX_FLAGS_RELEASE: "-MD -O2 -Ob2 -DNDEBUG"

jobs:
  build:
    runs-on: windows-latest
    # Two llama.cpp builds (CPU + Vulkan shaders) and the Vulkan whisper.cpp
    # build on a cold cache add ~45 min.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: apps/murmur-windows
    steps:
      - uses: actions/checkout@v4

      # D26: every copy of the product version agrees with VERSION; on a tag,
      # the tag is v<VERSION> and CHANGELOG.md has its section.
      - name: Version check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ../../tools/check-version.sh --tag "$GITHUB_REF_NAME"
          else
            ../../tools/check-version.sh
          fi
          v=$(tr -d '\r\n' < ../../VERSION)
          label="$v+$(git rev-parse --short=7 HEAD)"
          [ "$GITHUB_REF_TYPE" = tag ] && label="$GITHUB_REF_NAME"
          echo "MURMUR_LABEL=$label" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          # The version, profile and clippy come from rust-toolchain.toml.
          rustup toolchain install
          rustc --version
          cmake --version
          "$LIBCLANG_PATH/clang.exe" --version || true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/murmur-windows -> target
            . -> target
          cache-on-failure: true
          # Bump when apps/murmur-windows/.cargo/config.toml's GGML_* env or
          # the CMAKE_*_FLAGS_RELEASE env above changes: whisper-rs-sys'
          # build script does not track them, so a restored cache would keep
          # the old whisper.cpp objects.
          key: ggml-native-off-o2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sherpa-onnx-sys would download this itself into target/, but the
      # rust-cache restore keeps its build-script output and drops that
      # folder (link error "cannot open sherpa-onnx-c-api.lib"), so fetch it
      # to a stable place and point SHERPA_ONNX_LIB_DIR at it. The no-TTS
      # build (D80): the default one links espeak-ng (GPL-3.0) for
      # text-to-speech, which we never use.
      - name: sherpa-onnx prebuilt (Parakeet, no TTS)
        run: |
          v=1.13.8
          name=sherpa-onnx-v$v-win-x64-shared-MT-Release-no-tts-lib
          dir="$(cygpath -u "$RUNNER_TEMP")/sherpa"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/a.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/$name.tar.bz2"
          echo "a1253e665c4f236119c443c8932a8acfca32a546c78c05962d483c9a0eae21b7  $dir/a.tar.bz2" | sha256sum -c -
          (cd "$dir" && tar -xjf a.tar.bz2)  # a "D:" path would read as a remote host
          lib="$dir/$name/lib"
          # Keep every DLL next to the import libraries.
          find "$dir/$name" -name '*.dll' -exec cp -n {} "$lib/" \;
          ls -la "$lib"
          echo "SHERPA_ONNX_LIB_DIR=$(cygpath -w "$lib")" >> "$GITHUB_ENV"

      # Vulkan SDK for the GPU AI cleanup engine. The installer only runs
      # on a cache miss.
      - name: Vulkan SDK (cache)
        id: vksdk
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}

      - name: Vulkan SDK (install)
        if: steps.vksdk.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: .
        run: |
          $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Start-Process -FilePath $exe -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait -NoNewWindow

      - name: Vulkan SDK (env)
        shell: pwsh
        working-directory: .
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { Get-ChildItem C:\VulkanSDK -ErrorAction SilentlyContinue; throw "glslc not found in $sdk" }
          & "$sdk\Bin\glslc.exe" --version
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"

      - name: Front-end (ui/dist)
        run: npm --prefix ui ci && npm --prefix ui run build

      - name: Front-end unit tests (node --test)
        run: npm --prefix ui test

      - name: cargo test (default features = hybrid + cloud, whisper)
        run: cargo test --locked

      - name: cargo test (client only)
        run: cargo test --locked --no-default-features --features local

      - name: clippy (app, hybrid + Parakeet)
        run: cargo clippy --locked --all-targets --features app,parakeet -- -D warnings

      # A release build must say exactly which commit it is: no "-dirty".
      # Runs on every push so a tree the build dirties shows up before a
      # tag does; only a tag fails on it.
      - name: Clean tree (fails on tags)
        run: |
          git status --porcelain --untracked-files=no
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git --no-pager diff --stat
            git --no-pager diff | head -c 4000 | cat -A | head -60
            if [ "$GITHUB_REF_TYPE" = tag ]; then exit 1; fi
            echo "::warning::the build modified tracked files; a tag build would fail here"
          fi

      # The AI cleanup engine, from the root workspace: CPU, then Vulkan
      # (same target dir; the two llama.cpp builds have their own feature
      # hashes, so both stay cached). GGML_NATIVE=OFF keeps ggml portable,
      # as for whisper (0.9.2, AVX-512 crash): llama-cpp-sys-2 also forces it
      # unless target-cpu=native, so both DLLs get the AVX2 baseline. The
      # Vulkan DLL's GPU-vs-CPU policy is unit-tested here (murmur-llm
      # `backend`); it links vulkan-1.dll, which GPU drivers install.
      # Then whisper on the GPU (murmur-whisper, D42): only a Vulkan build, as
      # the app's built-in whisper is the CPU fallback. Its bindgen needs
      # LIBCLANG_PATH (the bundled bindings lack the Vulkan API, so a
      # bindgen failure stops the build rather than shipping a CPU DLL).
      - name: AI cleanup engine (CPU + Vulkan) and Vulkan whisper
        working-directory: .
        env:
          GGML_NATIVE: "OFF"
        run: |
          out=apps/murmur-windows/target/release
          mkdir -p "$out"
          cargo build --locked --release -p murmur-llm
          cp target/release/murmur_llm.dll "$out/murmur_llm.dll"
          cargo build --locked --release -p murmur-llm --features vulkan
          cp target/release/murmur_llm.dll "$out/murmur_llm_vulkan.dll"
          cargo test --locked --release -p murmur-llm --features vulkan --lib
          ls -la "$out"/murmur_llm*.dll
          # Short target dir: whisper.cpp's Vulkan build configures a nested
          # vulkan-shaders-gen project whose MSBuild tracker logs exceed
          # MAX_PATH under target/release/build/whisper-rs-sys-<hash>/
          # (FTK1011 "could not create the new file tracking log file").
          # Not covered by rust-cache, so this build is always cold.
          export CARGO_TARGET_DIR=D:/fw
          cargo build --locked --release -p murmur-whisper --features vulkan
          cp "$CARGO_TARGET_DIR/release/murmur_whisper.dll" "$out/murmur_whisper_vulkan.dll"
          cargo test --locked --release -p murmur-whisper --features vulkan --lib
          ls -la "$out"/murmur_whisper_vulkan.dll
          apps/murmur-windows/tools/ci/check-ggml-opt.sh "$CARGO_TARGET_DIR/release"

      - name: Release build (hybrid + Parakeet) and the DLL bundle overlay
        run: |
          cargo build --locked --release --features app,parakeet
          # The exe's built-in (CPU) whisper.cpp must be optimised too.
          tools/ci/check-ggml-opt.sh target/release
          # sherpa-onnx-sys copies its DLLs into target/release only when its
          # build script runs; after a rust-cache restore it does not, and the
          # cache drops top-level files. Copy them from the prebuilt dir.
          cp -n "$(cygpath -u "$SHERPA_ONNX_LIB_DIR")"/*.dll target/release/
          ls target/release/*.dll
          # D80: the DLLs the installers bundle carry no espeak-ng/piper (TTS) code.
          ../../tools/checks/no-tts-libs.sh target/release/sherpa-onnx*.dll target/release/onnxruntime*.dll
          tools/ci/parakeet-conf.sh target/release

      # I3/I4 + C2 + D28 gate, strict and cloud-strict (the defaults): the
      # flavour checks (cargo tree, nothing compiled) and the host scan of
      # the shipped hybrid exe (no provider host but openrouter.ai).
      - name: Build matrix (strict + cloud) incl. the exe
        working-directory: .
        env:
          CHECK_BUILD_MATRIX_NO_BUILD: "1"
        run: |
          MURMUR_CLOUD_ARTIFACTS=apps/murmur-windows/target/release/murmur-windows.exe \
          CHECK_BUILD_MATRIX_NOTICES=0 tools/check-build-matrix.sh

      # Tauri's bundler downloads WiX 3.14, NSIS 3.13 and nsis_tauri_utils
      # into its tools dir (dirs::cache_dir()\tauri = %LOCALAPPDATA%\tauri)
      # with no retry, so one GitHub 504 failed the installer step. Cache
      # that dir; on a miss, fetch the same files with retries and lay them
      # out as tauri-bundler 2.x does (bundle/windows/msi/mod.rs
      # get_and_extract_wix, nsis/mod.rs get_and_extract_nsis): it then finds
      # every required file with the right hash and downloads nothing. If a
      # CLI bump moves to newer tools, the bundler replaces the stale ones
      # itself (unprotected again): update the URLs, hashes and cache key.
      - name: Tauri bundler tools (cache)
        id: tauri-tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-wix314-nsis313-ntu053

      - name: Tauri bundler tools (download with retries)
        if: steps.tauri-tools.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $dl = Join-Path $env:RUNNER_TEMP 'tauri-tools'
          New-Item -ItemType Directory -Force $tools, $dl | Out-Null
          function Get-Verified($url, $out, $algo, $hash) {
            for ($i = 1; $i -le 5; $i++) {
              try {
                curl.exe -fsSL --retry 2 -o $out $url
                if ($LASTEXITCODE -ne 0) { throw "curl exit $LASTEXITCODE" }
                $got = (Get-FileHash -Algorithm $algo $out).Hash
                if ($got -ne $hash) { throw "$algo mismatch: $got" }
                return
              } catch {
                if ($i -eq 5) { throw "download failed: $url ($_)" }
                $wait = 10 * [math]::Pow(2, $i - 1)
                Write-Warning "attempt $i for $url failed ($_); retrying in $wait s"
                Start-Sleep -Seconds $wait
              }
            }
          }
          # WiX: the zip's files straight into WixTools314.
          $wix = Join-Path $dl 'wix.zip'
          Get-Verified 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' $wix SHA256 '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31'
          Expand-Archive -Force $wix (Join-Path $tools 'WixTools314')
          # NSIS: the zip's nsis-3.13 folder renamed to NSIS, plus the plugin.
          $nsis = Join-Path $dl 'nsis.zip'
          Get-Verified 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' $nsis SHA1 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E'
          Expand-Archive -Force $nsis $tools
          Move-Item (Join-Path $tools 'nsis-3.13') (Join-Path $tools 'NSIS')
          $plugins = Join-Path $tools 'NSIS\Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Get-Verified 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' (Join-Path $plugins 'nsis_tauri_utils.dll') SHA1 '75197FEE3C6A814FE035788D1C34EAD39349B860'
          # The bundler's own checks: NSIS.exe hash and the key files.
          $exe = (Get-FileHash -Algorithm SHA1 (Join-Path $tools 'NSIS\NSIS.exe')).Hash
          if ($exe -ne '6D45D4E8CCF18FE1FDAC9164058F356102A2ECF2') { throw "NSIS.exe SHA1 $exe" }
          foreach ($f in 'WixTools314\candle.exe', 'WixTools314\light.exe', 'WixTools314\WixUIExtension.dll', 'NSIS\makensis.exe', 'NSIS\Bin\makensis.exe', 'NSIS\Include\MUI2.nsh') {
            if (-not (Test-Path (Join-Path $tools $f))) { throw "missing $f" }
          }
          Get-ChildItem $tools

      - name: Installers (hybrid + cloud, whisper + Parakeet)
        run: |
          npx --yes @tauri-apps/cli@2 build --ci --bundles msi,nsis \
            --features app,parakeet --config tauri.parakeet.conf.json
          tools/ci/collect-bundle.sh hybrid

      - name: Installers (client only, whisper + Parakeet)
        run: |
          npx --yes @tauri-apps/cli@2 build --ci --bundles msi,nsis \
            --features local,app,parakeet --config tauri.parakeet.conf.json \
            -- --no-default-features
          tools/ci/collect-bundle.sh client

      # D80: what the installers (MSI and NSIS) unpack holds COPYRIGHT,
      # NOTICE and the full licence texts, and no TTS code (7-Zip reads both).
      - name: Installers carry the notices
        run: tools/ci/check-installer-notices.sh dist-ci/*/*.exe dist-ci/*/*.msi

      # The installers run `tauri build`, which may rewrite Cargo.toml (it
      # added `features = []` to tauri-build, so 1.0.0's CI exes said
      # "-dirty"), and rebuild the exe after the check above. Same check
      # again, after the last build.
      - name: Clean tree after the installers (fails on tags)
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git --no-pager diff --stat
            git --no-pager diff | head -c 4000 | cat -A | head -60
            if [ "$GITHUB_REF_TYPE" = tag ]; then exit 1; fi
            echo "::warning::the installer build modified tracked files; the exe says -dirty"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: murmur-windows-hybrid-${{ env.MURMUR_LABEL }}
          path: apps/murmur-windows/dist-ci/hybrid/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: murmur-windows-client-${{ env.MURMUR_LABEL }}
          path: apps/murmur-windows/dist-ci/client/
          if-no-files-found: error

  # Tag pushes only: attach the installers to the GitHub release (created
  # here or by android-build, whichever finishes first). Unsigned, as above.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: murmur-windows-*
          path: assets
          merge-multiple: true
      - name: Release upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"; v="${tag#v}"
          ls -la assets
          for f in assets/*; do
            case "$(basename "$f")" in *"_${v}_"*) ;; *) echo "installer without version $v in its name: $f" >&2; exit 1 ;; esac
          done
          (cd assets && sha256sum ./* | sed 's| \./| |' > "../SHA256SUMS-windows-$v.txt") && mv "SHA256SUMS-windows-$v.txt" assets/
          python3 tools/versioning/versioning.py section "$v" > notes.md
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "Murmur $v" --notes-file notes.md \
            || gh release view "$tag" >/dev/null   # lost the race to android-build: fine
          gh release upload "$tag" assets/* --clobber
