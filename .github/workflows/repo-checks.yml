# Cheap repo-wide checks that the path-filtered app builds would skip
# (docs-only branches never trigger them). A few minutes on ubuntu; only the
# runner's own Rust toolchain (cargo fetch + metadata, nothing compiled).
name: repo-checks

on:
  workflow_dispatch:
  push:
    branches: [integration, main, "feat/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the leak scan diffs the pushed range
      # Repo-local leak scan (docs/security.md): credentials, tailnet IPs,
      # home paths, non-noreply commit identities. CI is what sees a merge made
      # on github.com, which the local pre-push hook never does.
      - name: Leak scan tests
        run: tools/checks/leak-scan_test.sh
      - name: Leak scan (tree and pushed commits)
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tools/checks/leak-scan.py --tree
          head="${PR_HEAD:-$GITHUB_SHA}"
          base="$BEFORE"
          if [ -n "$PR_BASE" ]; then
            # From the merge-base, so lines integration deleted after the
            # branch point don't read as added by the PR.
            base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # New branch, tag or rewritten history: scan what is not on
            # integration (main in the public repo, which has no integration).
            base="$(git merge-base origin/integration "$head" 2>/dev/null \
              || git merge-base origin/main "$head" 2>/dev/null || true)"
          fi
          if [ -n "$base" ] && [ "$base" != "$head" ]; then
            tools/checks/leak-scan.py "$base..$head"
          fi
      # The public sync's fast-forward and refusal checks (docs/public-release/sync.md).
      - name: Public sync checks
        run: tools/public/sync_test.sh
      - name: Decision ids unique
        run: tools/checks/decision-ids.sh
      # The android-build native gate on a stub toolchain: no SIGPIPE flake,
      # and a failure names its check.
      - name: Native gate test
        run: apps/murmur-android/tools/probes/check_native_so_test.sh
      # The colleague bundle's model list stays in step with the apps'
      # catalogue, and its install note renders.
      - name: Colleague bundle helpers
        run: tools/bundle/colleague-bundle_test.sh
      # The murmur-server container's entrypoint (D77): config from a models
      # folder, the admin key never logged; a stub server, no Docker.
      - name: Container entrypoint
        run: tools/container/entrypoint_test.sh
      # D80: the installer notice check on stub MSI/NSIS layouts (no 7-Zip).
      - name: Installer notice check
        run: apps/murmur-windows/tools/ci/check-installer-notices_test.sh
      # D80: NOTICE's crate section and THIRD-PARTY-LICENSES (the full texts)
      # match both lockfiles; the registry fetch is all it needs.
      - name: Third-party notices current
        run: |
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path apps/murmur-windows/Cargo.toml
          python3 -I tools/notice/crate-licences.py --check
