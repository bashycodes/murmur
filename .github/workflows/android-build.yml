# Android shell (apps/flow-android): arm64 native libs for the three flavours
# (tools/build-native.sh), JVM unit tests, debug APKs, and the native .so/APK
# gates. No secrets, no release signing: the artifacts are debug-signed with
# this runner's throwaway debug key, so they install fresh but cannot update
# an APK built on another machine (INSTALL.md "Live test on phone").
# A pushed tag vX.Y.Z (tools/release.sh, D26) also checks the tag against
# VERSION/CHANGELOG and attaches the APKs to the GitHub release vX.Y.Z.
name: android-build

on:
  workflow_dispatch:
  push:
    branches: [integration, android-final]
    # Path filters are not evaluated for tag pushes: every release tag builds.
    tags: ["v*"]
    paths:
      - "apps/flow-android/**"
      - "crates/**"
      - "Cargo.lock"
      - "VERSION"
      - "tools/versioning/**"
      - "tools/check-version.sh"
      - "tools/check-build-matrix.sh"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/flow-android/**"
      - "crates/**"
      - "Cargo.lock"
      - "VERSION"
      - "tools/versioning/**"
      - "tools/check-version.sh"
      - "tools/check-build-matrix.sh"
      - ".github/workflows/android-build.yml"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: 27.2.12479018
  SHERPA_VERSION: 1.13.8

jobs:
  apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # D26: every copy of the product version agrees with VERSION; on a tag,
      # the tag is v<VERSION> and CHANGELOG.md has its section.
      - name: Version check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tools/check-version.sh --tag "$GITHUB_REF_NAME"
          else
            tools/check-version.sh
          fi
          v=$(cat VERSION)
          label="$v+$(git rev-parse --short=7 HEAD)"
          [ "$GITHUB_REF_TYPE" = tag ] && label="$GITHUB_REF_NAME"
          echo "FLOW_VERSION=$v" >> "$GITHUB_ENV"
          echo "FLOW_LABEL=$label" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust toolchain + cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          rustc --version; cmake --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > apps/flow-android/local.properties

      # Parakeet runtime for local/hybrid (the same prebuilts INSTALL.md §1 names).
      - name: sherpa-onnx Android prebuilt
        run: |
          dir="$RUNNER_TEMP/sherpa"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/a.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA_VERSION/sherpa-onnx-v$SHERPA_VERSION-android.tar.bz2"
          tar -xjf "$dir/a.tar.bz2" -C "$dir"
          lib="$(dirname "$(find "$dir" -path '*arm64-v8a/libsherpa-onnx-c-api.so' | head -1)")"
          ls -la "$lib"
          echo "SHERPA_ANDROID_LIBS=$lib" >> "$GITHUB_ENV"

      - name: Native libs (local, hybrid, remote)
        working-directory: apps/flow-android
        run: |
          for f in local hybrid remote; do tools/build-native.sh --flavor "$f"; done

      - name: Unit tests (3 flavours)
        working-directory: apps/flow-android
        run: ./gradlew --no-daemon testDebugUnitTest

      # A release build must say exactly which commit it is: no "-dirty".
      - name: Clean tree (tags)
        if: github.ref_type == 'tag'
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: APKs + native gates
        working-directory: apps/flow-android
        env:
          GRADLE_FLAGS: --no-daemon
        run: |
          tools/dist.sh --debug-only
          cat dist/sizes.txt

      # I3/I4 + C2 + D28 gate, strict and cloud-strict (the defaults): every
      # flavour check runs, and neither the sources nor the shipped APKs'
      # native libs name a provider host other than openrouter.ai.
      - name: Build matrix (strict + cloud) incl. the APKs
        run: |
          FLOW_CLOUD_ARTIFACTS="$(ls apps/flow-android/dist/*.apk | tr '\n' ' ')" \
            tools/check-build-matrix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flow-clone-android-debug-apks-${{ env.FLOW_LABEL }}
          path: |
            apps/flow-android/dist/*.apk
            apps/flow-android/dist/SHA256SUMS
            apps/flow-android/dist/sizes.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: apps/flow-android/app/build/reports/

  # Tag pushes only: attach the APKs to the GitHub release (created here or
  # by windows-build, whichever finishes first). Debug-signed, as above.
  release:
    if: github.ref_type == 'tag'
    needs: apks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flow-clone-android-debug-apks-*
          path: dl
          merge-multiple: true
      - name: Versioned file names + release upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"; v="${tag#v}"
          mkdir -p assets
          for f in dl/flow-clone-*-debug.apk; do
            fl=$(basename "$f" | sed -E 's/^flow-clone-(.*)-debug\.apk$/\1/')
            cp "$f" "assets/flow-clone-android-$fl-$v-debug.apk"
          done
          (cd assets && sha256sum ./*.apk | sed 's| \./| |' > "SHA256SUMS-android-$v.txt")
          ls -la assets
          python3 tools/versioning/versioning.py section "$v" > notes.md
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "Flow Clone $v" --notes-file notes.md \
            || gh release view "$tag" >/dev/null   # lost the race to windows-build: fine
          gh release upload "$tag" assets/* --clobber
