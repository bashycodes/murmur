# Android shell (apps/flow-android): arm64 native libs for the three flavours
# (tools/build-native.sh), JVM unit tests, debug APKs, and the native .so/APK
# gates. No release signing: the artifacts are debug-signed with the owner's
# fixed debug key (D56), restored from the repo secret ANDROID_DEBUG_KEYSTORE_B64,
# so a CI APK installs over a locally built one (install -r keeps the app's data)
# and the "Debug key" gate checks every APK's certificate against the pinned
# apps/flow-android/debug-cert.sha256. Without the secret (forks) the runner
# makes a throwaway debug key, and those APKs cannot update another machine's
# (INSTALL.md "Live test on phone").
# A pushed tag vX.Y.Z (tools/release.sh, D26) also checks the tag against
# VERSION/CHANGELOG and attaches the APKs to the GitHub release vX.Y.Z.
name: android-build

on:
  workflow_dispatch:
  push:
    branches: [integration, android-final, "feat/**"]
    # Path filters are not evaluated for tag pushes: every release tag builds.
    tags: ["v*"]
    paths:
      - "apps/flow-android/**"
      - "crates/**"
      - "Cargo.lock"
      - "VERSION"
      - "tools/versioning/**"
      - "tools/check-version.sh"
      - "tools/check-build-matrix.sh"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/flow-android/**"
      - "crates/**"
      - "Cargo.lock"
      - "VERSION"
      - "tools/versioning/**"
      - "tools/check-version.sh"
      - "tools/check-build-matrix.sh"
      - ".github/workflows/android-build.yml"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: 27.2.12479018
  SHERPA_VERSION: 1.13.8

jobs:
  apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # D26: every copy of the product version agrees with VERSION; on a tag,
      # the tag is v<VERSION> and CHANGELOG.md has its section.
      - name: Version check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tools/check-version.sh --tag "$GITHUB_REF_NAME"
          else
            tools/check-version.sh
          fi
          v=$(cat VERSION)
          label="$v+$(git rev-parse --short=7 HEAD)"
          [ "$GITHUB_REF_TYPE" = tag ] && label="$GITHUB_REF_NAME"
          echo "FLOW_VERSION=$v" >> "$GITHUB_ENV"
          echo "FLOW_LABEL=$label" >> "$GITHUB_ENV"

      # D56: sign the debug APKs with the owner's fixed debug key (AGP uses
      # ~/.android/debug.keystore), before any Gradle step can create its own.
      # The secret goes through env and a file only, never to the log.
      - name: Debug key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::ANDROID_DEBUG_KEYSTORE_B64 not set: throwaway debug key, these APKs cannot update a locally built app"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "FLOW_FIXED_DEBUG_KEY=1" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust toolchain + cargo-ndk
        run: |
          # The version comes from rust-toolchain.toml.
          rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          rustc --version; cmake --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > apps/flow-android/local.properties

      # Parakeet runtime for local/hybrid (the same prebuilts INSTALL.md §1 names).
      - name: sherpa-onnx Android prebuilt
        run: |
          dir="$RUNNER_TEMP/sherpa"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/a.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA_VERSION/sherpa-onnx-v$SHERPA_VERSION-android.tar.bz2"
          tar -xjf "$dir/a.tar.bz2" -C "$dir"
          lib="$(dirname "$(find "$dir" -path '*arm64-v8a/libsherpa-onnx-c-api.so' | head -1)")"
          ls -la "$lib"
          echo "SHERPA_ANDROID_LIBS=$lib" >> "$GITHUB_ENV"

      - name: Native libs (local, hybrid, remote)
        working-directory: apps/flow-android
        run: |
          for f in local hybrid remote; do tools/build-native.sh --flavor "$f"; done

      - name: Unit tests (3 flavours)
        working-directory: apps/flow-android
        run: ./gradlew --no-daemon testDebugUnitTest

      # A release build must say exactly which commit it is: no "-dirty".
      - name: Clean tree (tags)
        if: github.ref_type == 'tag'
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: APKs + native gates
        working-directory: apps/flow-android
        env:
          GRADLE_FLAGS: --no-daemon
        run: |
          tools/dist.sh --debug-only
          cat dist/sizes.txt

      # D56: with the fixed key restored, every debug APK must carry its
      # certificate (pinned public SHA-256), or it would not install over the
      # phone's app without wiping it.
      - name: Debug key gate
        if: env.FLOW_FIXED_DEBUG_KEY == '1'
        # apksigner pinned to build-tools 36.0.0: the image's newest (37.0.0)
        # printed no certificate lines for these APKs (run 42081648042). The
        # second command only records what 37.0.0 prints, for the diagnosis.
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            apps/flow-android/tools/check-apk-cert.sh apps/flow-android/dist/*-debug.apk
          a37="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          if [ -e "$a37" ]; then
            echo "build-tools 37.0.0 apksigner (diagnostic only):"
            ls -la "$a37"
            "$a37" verify --print-certs apps/flow-android/dist/flow-clone-remote-debug.apk 2>&1 | head -10 || true
          fi

      # I3/I4 + C2 + D28 gate, strict and cloud-strict (the defaults): every
      # flavour check runs, and neither the sources nor the shipped APKs'
      # native libs name a provider host other than openrouter.ai.
      - name: Build matrix (strict + cloud) incl. the APKs
        run: |
          FLOW_CLOUD_ARTIFACTS="$(ls apps/flow-android/dist/*.apk | tr '\n' ' ')" \
            tools/check-build-matrix.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flow-clone-android-debug-apks-${{ env.FLOW_LABEL }}
          path: |
            apps/flow-android/dist/*.apk
            apps/flow-android/dist/SHA256SUMS
            apps/flow-android/dist/sizes.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: apps/flow-android/app/build/reports/

  # Tag pushes only: attach the APKs to the GitHub release (created here or
  # by windows-build, whichever finishes first). Debug-signed, as above: with
  # the fixed debug key (D56), unless the secret was missing.
  release:
    if: github.ref_type == 'tag'
    needs: apks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flow-clone-android-debug-apks-*
          path: dl
          merge-multiple: true
      - name: Versioned file names + release upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"; v="${tag#v}"
          mkdir -p assets
          for f in dl/flow-clone-*-debug.apk; do
            fl=$(basename "$f" | sed -E 's/^flow-clone-(.*)-debug\.apk$/\1/')
            cp "$f" "assets/flow-clone-android-$fl-$v-debug.apk"
          done
          (cd assets && sha256sum ./*.apk | sed 's| \./| |' > "SHA256SUMS-android-$v.txt")
          ls -la assets
          python3 tools/versioning/versioning.py section "$v" > notes.md
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "Murmur $v" --notes-file notes.md \
            || gh release view "$tag" >/dev/null   # lost the race to windows-build: fine
          gh release upload "$tag" assets/* --clobber
