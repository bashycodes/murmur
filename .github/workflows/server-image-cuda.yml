# murmur-server's NVIDIA CUDA image (deploy/docker/Dockerfile `--target cuda`,
# D84): checks that the CUDA plugins (llama.cpp and whisper.cpp) compile and
# link and that the image starts (no GPU on the runner). Its own workflow so
# it is never a required check: it is the slowest build in the repo. Runs
# when the CUDA build's inputs change, on pull requests and on main
# (feature-branch pushes are covered by their pull request: push +
# pull_request would build twice, in two concurrency groups), on release
# tags (path filters do not apply to tags), and by hand (workflow_dispatch).
# Pull requests and main: build only, one GPU architecture, no registry
# login, nothing pushed.
# A vX.Y.Z tag (or workflow_dispatch with a tag, to publish an older release
# later): the tag must match VERSION (the D26 version gate); the build covers
# RELEASE_CUDAARCHS and, after the checks pass, the tested image is pushed to
# ghcr.io/<owner>/murmur-server as :X.Y.Z-cuda and :latest-cuda.
# Every run is a cold cargo + nvcc build: type=gha keeps image layers, not
# BuildKit cache mounts (the stage's cargo registry and target/).
name: server-image-cuda

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check out and publish (e.g. v1.7.1); empty = build only"
        default: ""
      cudaarchs:
        description: "GPU architectures (CUDAARCHS); empty = 86, or the release set with a tag. The image's default is 75;80;86;89;90;120"
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      # Everything the build context carries (.dockerignore): the cuda
      # target also builds the CPU server from the whole workspace.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "VERSION"
      - "deploy/docker/**"
      - ".dockerignore"
      - "COPYRIGHT"
      - "NOTICE"
      - "THIRD-PARTY-LICENSES"
      - "tools/container/stage-prebuilt.sh"
      - ".github/workflows/server-image-cuda.yml"
  pull_request:
    paths:
      # Everything the build context carries (.dockerignore): the cuda
      # target also builds the CPU server from the whole workspace.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "VERSION"
      - "deploy/docker/**"
      - ".dockerignore"
      - "COPYRIGHT"
      - "NOTICE"
      - "THIRD-PARTY-LICENSES"
      - "tools/container/stage-prebuilt.sh"
      - ".github/workflows/server-image-cuda.yml"

concurrency:
  group: server-image-cuda-${{ inputs.tag || github.ref }}
  # A release publish always runs to the end.
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.tag }}

permissions:
  contents: read

env:
  # The published image's GPU architectures. The CUDA stage took ~37 min
  # for one architecture (sm_86) on the hosted runner, most of it nvcc, so
  # the image default's six (75-120) would risk the 6 h job limit. These
  # four cover the consumer cards natively (Turing, Ampere, Ada,
  # Blackwell); CMake also embeds each one's PTX, which the driver
  # JIT-compiles on first use for the data-centre 80 (A100, from 75) and
  # 90 (H100, from 89). Other sets: build it yourself (docs/container.md §8).
  RELEASE_CUDAARCHS: "75;86;89;120"

jobs:
  cuda:
    runs-on: ubuntu-24.04
    # A release builds four architectures (RELEASE_CUDAARCHS).
    timeout-minutes: ${{ (github.ref_type == 'tag' || inputs.tag) && 330 || 180 }}
    permissions:
      contents: read
      packages: write  # used only by the publish steps (release tags)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}  # empty: the event's own ref

      # publish / version / revision / cudaarchs. A tag must be vX.Y.Z and
      # pass the D26 version gate (tag = v<VERSION>, CHANGELOG section).
      # Inline, not a script: a dispatch checks out an older tag, which
      # lacks new tools.
      - name: Release
        id: release
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
          ARCHS: ${{ inputs.cudaarchs }}
        run: |
          if [ -n "$TAG" ]; then
            [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag (vX.Y.Z)"; exit 1; }
            tools/check-version.sh --tag "$TAG"
            { echo "publish=true"; echo "version=${TAG#v}"; echo "cudaarchs=${ARCHS:-$RELEASE_CUDAARCHS}"; } >>"$GITHUB_OUTPUT"
          else
            { echo "publish=false"; echo "version=$(tr -d '[:space:]' <VERSION)"; echo "cudaarchs=${ARCHS:-86}"; } >>"$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/murmur-server" >>"$GITHUB_OUTPUT"

      # Registry tags (release only) and OCI labels (every build).
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}-cuda,enable=${{ steps.release.outputs.publish }}
            type=raw,value=latest-cuda,enable=${{ steps.release.outputs.publish }}
          labels: |
            org.opencontainers.image.title=murmur-server (CUDA)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}

      # The CUDA devel image and two CUDA builds need more disk than the
      # runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # One architecture (Ampere, sm_86) unless releasing: the build is
      # checked, not shipped, and every extra architecture adds nvcc time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: cuda
          push: false
          load: true
          tags: murmur-server:ci-cuda
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MURMUR_GIT_SHA=${{ steps.release.outputs.revision }}
            CARGO_BUILD_JOBS=4
            CUDAARCHS=${{ steps.release.outputs.cudaarchs }}
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,scope=cuda,mode=min

      # Without a GPU the image must still start: the CLI runs, and the
      # entrypoint refuses an empty models folder with its message. The
      # plugins resolve every library but the driver's libcuda.so.1, which
      # the NVIDIA container toolkit injects at run time.
      - name: Image starts, plugins link
        run: |
          docker run --rm --entrypoint /opt/murmur-server/bin/murmur-server murmur-server:ci-cuda gen-token --out /tmp/t
          if docker run --rm murmur-server:ci-cuda >out.txt 2>&1; then cat out.txt; exit 1; fi
          grep -q "no speech model in /models" out.txt || { cat out.txt; exit 1; }
          docker run --rm --entrypoint sh murmur-server:ci-cuda -c '
            set -eu
            cd /opt/murmur-server/lib
            ls -l
            for p in libmurmur_whisper_cuda.so libmurmur_llm_cuda.so; do
              missing=$(ldd "$p" | awk "/not found/ {print \$1}" | grep -vx "libcuda.so.1" || true)
              [ -z "$missing" ] || { echo "FAIL: $p: missing $missing"; exit 1; }
            done
            echo "MURMUR_WHISPER_LIB=$MURMUR_WHISPER_LIB"; test -f "$MURMUR_WHISPER_LIB"'
          docker image ls murmur-server:ci-cuda

      # Release only: push the very image the checks above ran on.
      - name: Log in to ghcr.io
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker tag murmur-server:ci-cuda "$t"
            docker push "$t"
          done
