# murmur-server container image (deploy/docker/Dockerfile, D77): checks that
# it builds and starts. Build only: nothing is pushed or published (users
# build it from the source, docs/server-setup.md). Runs on pull requests, on
# integration and on the public repo's main (path-filtered) and on release
# tags (path filters do not apply to tags); feature-branch pushes are covered
# by their pull request.
# CPU image only: the CUDA variant (`--target cuda`) is built locally.
name: server-image

on:
  workflow_dispatch:
  push:
    branches: [integration, main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/docker/**"
      - ".dockerignore"
      - "COPYRIGHT"
      - "NOTICE"
      - "THIRD-PARTY-LICENSES"
      - ".github/workflows/server-image.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/docker/**"
      - ".dockerignore"
      - "COPYRIGHT"
      - "NOTICE"
      - "THIRD-PARTY-LICENSES"
      - ".github/workflows/server-image.yml"

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: murmur-server:ci
          build-args: |
            MURMUR_GIT_SHA=${{ github.sha }}
            CARGO_BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start: the CLI runs with its libraries, and the
      # entrypoint refuses an empty models folder with its message.
      - name: Image starts
        run: |
          docker run --rm --entrypoint /opt/murmur-server/bin/murmur-server murmur-server:ci gen-token --out /tmp/t
          if docker run --rm murmur-server:ci >out.txt 2>&1; then cat out.txt; exit 1; fi
          grep -q "no speech model in /models" out.txt || { cat out.txt; exit 1; }
          docker image ls murmur-server:ci

      # D80: the image carries the rights, notices and full licence texts, and
      # its sherpa-onnx libraries no TTS (espeak-ng) code.
      - name: Image carries the notices
        run: |
          id=$(docker create murmur-server:ci)
          docker cp "$id:/opt/murmur-server" img; docker rm "$id"
          for f in COPYRIGHT NOTICE THIRD-PARTY-LICENSES; do test -s "img/$f" || { echo "FAIL: no /opt/murmur-server/$f"; exit 1; }; done
          grep -q 'All rights reserved' img/COPYRIGHT
          tools/checks/no-tts-libs.sh img/lib/*.so*
