[package]
name = "murmur-whisper"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "whisper.cpp speech engine as a plugin library (the Windows GPU build: murmur_whisper_vulkan.dll)"

# cdylib = the plugin murmur-core loads at runtime (`whisper_plugin`); rlib =
# the Rust API for tests. A separate library for the same reason as
# murmur-llm (D10): the Vulkan build bundles its own whisper.cpp + ggml, and
# the app already links the CPU whisper.cpp. A cdylib exports only the
# `murmur_whisper_*` functions, so its ggml stays private.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The decode itself (padding, silence gate, fitted encoder window and its
# repetition guard, prompt) is murmur-core's WhisperEngine, so the plugin
# transcribes exactly like the built-in engine.
murmur-core = { path = "../murmur-core", features = ["whisper"] }
murmur-build-info = { path = "../murmur-build-info" }
# raw-api: ggml's device list (backend.rs).
whisper-rs = { version = "0.16", features = ["raw-api"] }
serde.workspace = true
serde_json.workspace = true

[features]
# GPU through Vulkan (whisper.cpp GGML_VULKAN). Needs the Vulkan SDK
# (VULKAN_SDK, glslc) at build time. The Windows CI builds it as
# murmur_whisper_vulkan.dll; it links vulkan-1.dll, so on a PC without a
# Vulkan driver it does not load and the app uses its built-in CPU whisper.
# Inside it, no usable GPU, or a GPU that fails to load the model, means
# the CPU (`backend::choose`, `Plan::fallbacks`).
vulkan = ["whisper-rs/vulkan"]
# GPU through CUDA (whisper.cpp GGML_CUDA), for murmur-server's CUDA image
# (deploy/docker/Dockerfile `cuda-whisper`, D84). Needs the CUDA toolkit
# (nvcc, cuBLAS) at build time. The .so links libcudart, libcublas and
# libcublasLt (shipped in the image) and the driver's libcuda.so.1 (injected
# by the NVIDIA container runtime): without a driver it does not load and
# the server uses its built-in CPU whisper; without a GPU it runs on the CPU
# (`backend::choose`).
cuda = ["whisper-rs/cuda"]

[dev-dependencies]
# tests/plugin_e2e.rs drives the built cdylib through murmur-core's loader.
murmur-core = { path = "../murmur-core", features = ["whisper", "whisper-plugin", "wav"] }
