[package]
name = "flow-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI + JNI bindings for flow-core"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
whisper = ["flow-core/whisper"]
# Runtime-loads the flow-llm plugin (ship libflow_llm next to the executable).
llm = ["flow-core/llm"]
jni = ["dep:jni"]
# Parakeet-TDT engine; ship libsherpa-onnx-c-api.so + libonnxruntime.so with the library.
parakeet = ["flow-core/parakeet"]
# D17: the server route (WebSocket client, wss with rustls). Client-only builds
# leave it off: flow-router is always linked, flow-remote (the only network
# code) is not (I3; tools/check-build-matrix.sh).
remote = []  # becomes ["dep:flow-remote"] when flow-remote is merged

[dependencies]
flow-core = { path = "../flow-core" }
flow-router = { path = "../flow-router" }
serde_json.workspace = true
jni = { version = "0.21", optional = true }
