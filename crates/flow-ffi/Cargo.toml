[package]
name = "flow-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI + JNI bindings for flow-core"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
whisper = ["flow-core/whisper"]
# Runtime-loads the flow-llm plugin (ship libflow_llm next to the executable).
llm = ["flow-core/llm"]
jni = ["dep:jni"]
# Parakeet-TDT engine; ship libsherpa-onnx-c-api.so + libonnxruntime.so with the library.
parakeet = ["flow-core/parakeet"]
# D17: the server route (WebSocket client, wss with rustls). Client-only builds
# leave it off: flow-router is always linked, flow-remote (the only network
# code) is not (I3; tools/check-build-matrix.sh).
remote = ["dep:flow-remote"]
# D18: third-party cloud STT (flow-cloud: reqwest + rustls). Only the Android
# `hybrid` / `remote` flavours enable it; the `local` flavour's library must
# not link it (C2; tools/check-build-matrix.sh, verifyLocal*NoNetworkCode).
cloud = ["dep:flow-cloud"]

[dependencies]
flow-build-info = { path = "../flow-build-info" }
flow-core = { path = "../flow-core" }
flow-router = { path = "../flow-router" }
flow-remote = { path = "../flow-remote", optional = true, features = ["tls"] }
flow-cloud = { path = "../flow-cloud", optional = true }
serde_json.workspace = true
jni = { version = "0.21", optional = true }

[dev-dependencies]
# jni_smoke routes a JVM session to an in-process flow-server (mock ASR) with `--features jni,remote`.
flow-server = { path = "../flow-server", default-features = false, features = ["tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# jni_cloud routes a JVM session to flow-cloud's in-process mock provider with `--features jni,cloud`.
flow-cloud = { path = "../flow-cloud", features = ["mock-server"] }
