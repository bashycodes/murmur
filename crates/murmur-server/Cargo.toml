[package]
name = "murmur-server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Self-hosted murmur-core server for hybrid dictation (LAN/VPN only; stores no audio or text unless [debug] capture is on)"

[features]
default = ["whisper", "tls"]
whisper = ["murmur-core/whisper"]
parakeet = ["murmur-core/parakeet"]
llm = ["murmur-core/llm"]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]

[dependencies]
murmur-build-info = { path = "../murmur-build-info" }
murmur-core = { path = "../murmur-core" }
murmur-protocol = { path = "../murmur-protocol" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "service"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
getrandom = "0.2"
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
# `wav`: tests/languages.rs reads a Hebrew clip for the real-model test.
murmur-core = { path = "../murmur-core", features = ["wav"] }
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
