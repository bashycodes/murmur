[package]
name = "flow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dev harness: run the full flow-core pipeline on a WAV file"

[features]
default = ["whisper", "llm"]
whisper = ["flow-core/whisper"]
# Needs the flow-llm plugin at runtime (`cargo build -p flow-llm`); the
# feature itself only adds the loader.
llm = ["flow-core/llm"]
# `--engine parakeet`: links libsherpa-onnx-c-api + libonnxruntime, which the
# build copies next to the binary (build.rs adds an $ORIGIN rpath).
parakeet = ["flow-core/parakeet"]
# `meeting --router` with a server route (links flow-remote's network code).
remote = ["dep:flow-remote"]

[dependencies]
flow-core = { path = "../flow-core", features = ["wav"] }
flow-router = { path = "../flow-router" }
flow-remote = { path = "../flow-remote", optional = true, features = ["tls"] }
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
hound = "3"
