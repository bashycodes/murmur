[package]
name = "flow-contract-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Hybrid contract suites: local vs in-process server / mock cloud equivalence, toggle matrix, build matrix, key-leak checks"

[features]
default = []
# Real-model equivalence (skips without models).
whisper = ["flow-core/whisper", "flow-server/whisper"]
parakeet = ["flow-core/parakeet", "flow-server/parakeet"]
llm = ["flow-core/llm", "flow-server/llm"]

[dependencies]
flow-core = { path = "../flow-core", features = ["wav"] }
flow-protocol = { path = "../flow-protocol" }
flow-router = { path = "../flow-router" }
flow-remote = { path = "../flow-remote", features = ["tls"] }
flow-server = { path = "../flow-server", default-features = false, features = ["tls"] }
flow-cloud = { path = "../flow-cloud", features = ["mock-server"] }
serde = { workspace = true }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
claxon = "0.4"
tempfile = "3"
