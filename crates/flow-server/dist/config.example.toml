# flow-server example config (/etc/flow-server/config.toml).
# Bind only to loopback / LAN / VPN addresses; the server must never be
# reachable from the internet. Recommended: the machine's VPN address (e.g. 100.x).
# 0.0.0.0, :: or a public address is refused unless [tls] is set (or the
# --insecure-bind-any flag is given); peers outside loopback/LAN/VPN are
# dropped before any byte is read either way (unless --insecure-bind-any).
bind = ["127.0.0.1:7313"]          # e.g. ["127.0.0.1:7313", "100.64.0.10:7313"]
token_file = "/etc/flow-server/token"  # create with: flow-server gen-token --out /etc/flow-server/token
# auth = "none"                    # only accepted when every bind address is loopback
workers = 1            # FlowCore instances; each holds its models (Parakeet ~0.9 GB RSS)
max_queue = 2          # sessions waiting for a worker
queue_timeout_ms = 30000
idle_timeout_s = 120   # close idle connections
max_session_s = 1200   # 20 min, same as the Windows hard stop
handshake_timeout_ms = 10000  # TLS handshake + HTTP upgrade request must finish by then
max_connections = 64          # open sockets in total (unauthenticated ones included)
max_connections_per_ip = 16   # open sockets per peer address

[model]                # = flow_core::ModelConfig
asr_engine = "parakeet"
asr_path = "/var/lib/flow-server/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
threads = 4            # 4 on the i7-6700: oversubscribing hyperthreads is far slower
# llm_path = "/var/lib/flow-server/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
# llm_lib = "/usr/local/lib/libflow_llm.so"
# vad_model_path = "/var/lib/flow-server/models/ggml-silero-v5.1.2.bin"

# Per-language models (D33). A session whose language is forced to one of
# these (the client's language setting: "he", "he-IL" and "iw" all match
# "he") decodes on that model; every other session, auto-detect included,
# on the model above. hello_ok lists the keys as "languages". Each worker
# loads every model (zipformer-he: 69 MiB on disk).
# [model.languages.he]                 # Hebrew: tools/fetch-models.sh --hebrew
# asr_backend = "sherpa_online"        # streaming zipformer (alias "zipformer"); needs the parakeet feature
# asr_path = "/var/lib/flow-server/models/zipformer2-66m-streaming-he-int8"
# threads = 4                          # optional, default [model] threads
# Alternative, 642 MiB, slightly less accurate (fetch-models.sh --hebrew-parakeet):
# asr_backend = "parakeet"
# asr_path = "/var/lib/flow-server/models/parakeet-tdt-0.6b-v3-he-int8"

# [tls]                # optional wss:// (LAN without a VPN); pin the cert in the client
# cert = "/etc/flow-server/cert.pem"
# key = "/etc/flow-server/key.pem"

[log]
level = "info"         # RUST_LOG overrides; dependencies are capped at info either way
log_text = false       # true prints transcripts at debug level (startup warns)

# [debug]              # beta replay tool; off unless capture = true (startup warns)
# capture = false      # true: save each session's received audio (WAV) + one JSON line
#                      # (transcript, cleaned text, timings, route); never the token
# max_files = 30       # newest WAVs kept
# max_age_h = 72       # older ones deleted (on every save and at start)
# dir = "/var/lib/flow-server/debug"  # default: <state dir>/debug
