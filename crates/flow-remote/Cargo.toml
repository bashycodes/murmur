[package]
name = "flow-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RemoteBackend: WebSocket client of flow-server behind flow_router::Router (the only client-side network code)"

[features]
default = []
# wss:// with rustls (Mozilla roots via webpki-roots, or a pinned leaf cert).
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:sha2"]

[dependencies]
flow-core = { path = "../flow-core", default-features = false }
flow-protocol = { path = "../flow-protocol" }
flow-router = { path = "../flow-router" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
