[package]
name = "flow-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Shared local dictation core: ASR session, cleanup, deterministic post-processing"

[features]
default = []
whisper = ["dep:whisper-rs"]
llm = ["dep:libloading"]
# The GPU whisper.cpp plugin (crate flow-whisper; Windows
# flow_whisper_vulkan.dll), loaded at runtime like the `llm` plugin.
whisper-plugin = ["dep:libloading"]
wav = ["dep:hound"]
# Parakeet-TDT via sherpa-onnx (links libsherpa-onnx-c-api + libonnxruntime).
parakeet = ["dep:flow-asr-sherpa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
rtrb = "0.3"
whisper-rs = { version = "0.16", optional = true }
hound = { version = "3", optional = true }
libloading = { version = "0.8", optional = true }
flow-asr-sherpa = { path = "../flow-asr-sherpa", optional = true }

[[test]]
name = "whisper_e2e"
required-features = ["whisper", "wav"]

[[test]]
name = "parakeet_e2e"
required-features = ["parakeet", "wav"]

[[test]]
name = "vad_bench"
required-features = ["whisper", "wav"]

[[test]]
name = "segment_bench"
required-features = ["wav"]

[[test]]
name = "audio_ctx_bench"
required-features = ["whisper", "wav"]

[[test]]
name = "lid_e2e"
required-features = ["whisper", "wav"]

[[test]]
name = "sherpa_online_e2e"
required-features = ["parakeet", "wav"]

[[example]]
name = "vad_gate"
required-features = ["wav"]
