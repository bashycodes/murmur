<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a cloud model (OpenRouter)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="murmur-theme.css">
<link rel="stylesheet" href="ds/murmur/components/bundle.css">
<script src="ds/murmur/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap">
<style>
body{margin:0}
a{color:#1a1a1a}a:hover{color:#30302f}
</style>
</helmet>
<div class="fl" style="width: 1040px; height: 1000px; box-sizing: border-box; padding: 40px; display: flex; align-items: center; justify-content: center; background: var(--scrim); font-family: var(--font-sans); color: var(--foreground);">
  <div class="fl-dialog" role="dialog" aria-label="Choose a speech model" style="width: 680px; gap: 20px; background: var(--shade-white);">
    <div style="display: flex; align-items: flex-start; gap: 12px;">
      <div style="flex: 1;">
        <h2 class="fl-serif" style="margin: 0 0 6px; font-size: 28px; line-height: 28px; font-weight: 400;">Choose a speech model</h2>
        <div style="font: 400 13px/20px var(--font-sans); color: var(--foreground-tertiary);">Live list from OpenRouter · updated today</div>
      </div>
      <a href="SettingsSpeech.dc.html" class="fl-iconbtn" aria-label="Close"><svg class="fl-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="position: relative;">
        <svg class="lw-ico" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 12px; top: 10px; width: 16px; height: 16px; color: var(--foreground-tertiary);"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
        <input class="fl-input" type="search" aria-label="Search models" placeholder="Search 28 models" style="width: 100%; padding-left: 36px;">
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
          <button type="button" class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.toggle}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div class="fl-list" style="max-height: 520px; overflow: hidden;">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="7">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.selectedText}}" class="fl-list-row" style="width: 100%; border: 0; border-top: 1px solid var(--border); background: {{m.bg}}; text-align: left; cursor: pointer; font: inherit; color: inherit;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <span style="font: 550 15px/20px var(--font-sans);">{{m.name}}</span>
              <sc-if value="{{m.rec}}" hint-placeholder-val="{{false}}"><span class="fl-badge fl-badge-dark">Recommended</span></sc-if>
              <sc-if value="{{m.fast}}" hint-placeholder-val="{{false}}"><span class="fl-badge fl-badge-light">Fast</span></sc-if>
            </span>
            <span class="lw-mono" style="color: var(--foreground-tertiary); font-size: 12px; line-height: 18px;">{{m.id}}</span>
          </span>
          <span style="flex: none; width: 110px; text-align: right; font: 400 14px/20px var(--font-sans); color: var(--neutral-600);">{{m.price}}</span>
          <span style="flex: none; width: 20px; display: inline-flex; justify-content: center;">
            <sc-if value="{{m.selected}}" hint-placeholder-val="{{false}}"><svg class="fl-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="font: 400 13px/20px var(--font-sans); color: var(--foreground-tertiary);">7 more models are hidden because no zero-retention provider serves them.</div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <input class="fl-input" type="text" aria-label="Custom model ID" placeholder="Or paste a model ID" style="flex: 1; width: auto;">
      <a href="SettingsSpeech.dc.html" class="fl-btn fl-btn-ghost" style="text-decoration: none;">Cancel</a>
      <a href="SettingsSpeech.dc.html" class="fl-btn fl-btn-primary" style="text-decoration: none;">Use this model</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'openai/whisper-large-v3-turbo', chips: { tr: true, chat: false, zdr: true, fast: false, free: false } };
  }
  renderVals() {
    const chipDefs = [['tr', 'Transcription'], ['chat', 'Chat models with audio'], ['zdr', 'Zero retention only'], ['fast', 'Fast providers'], ['free', 'Free']];
    const list = [
      ['Whisper Large V3 Turbo', 'openai/whisper-large-v3-turbo', '$0.012 / hour', true, true],
      ['Whisper Large V3', 'openai/whisper-large-v3', '$0.027 / hour', false, true],
      ['Qwen3 ASR 1.7B', 'qwen/qwen3-asr-1.7b', '$0.027 / hour', false, false],
      ['Parakeet TDT 0.6B v3', 'nvidia/parakeet-tdt-0.6b-v3', '$0.09 / hour', false, false],
      ['Voxtral Mini Transcribe 3', 'mistralai/voxtral-mini-transcribe-3-0', '$0.21 / hour', false, false],
      ['Scribe v2', 'elevenlabs/scribe-v2', '$0.22 / hour', false, false],
      ['Nova-3', 'deepgram/nova-3', '$0.26 / hour', false, false]
    ];
    return {
      chips: chipDefs.map(([k, label]) => ({
        label,
        on: this.state.chips[k] ? 'true' : 'false',
        cls: this.state.chips[k] ? 'lw-chip is-on' : 'lw-chip',
        toggle: () => this.setState({ chips: Object.assign({}, this.state.chips, { [k]: !this.state.chips[k] }) })
      })),
      models: list.map(([name, id, price, rec, fast]) => {
        const selected = id === this.state.picked;
        return {
          name, id, price, rec, fast, selected,
          selectedText: selected ? 'true' : 'false',
          bg: selected ? 'var(--background-tertiary)' : 'transparent',
          pick: () => this.setState({ picked: id })
        };
      })
    };
  }
}
</script>
</body>
</html>
