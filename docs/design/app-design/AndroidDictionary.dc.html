<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Android: Dictionary</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="murmur-theme.css">
<link rel="stylesheet" href="ds/murmur/components/bundle.css">
<script src="ds/murmur/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="lw-android" style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: var(--a-bg); overflow: hidden;">
  <header style="flex: none; height: 64px; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; padding: 0 4px;">
    <a href="AndroidDrawer.dc.html" aria-label="Open menu" style="width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; color: var(--a-ink);"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round;"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></a>
    <span style="text-align: center; font: 700 22px/28px var(--font-sans); letter-spacing: -0.02em;">Murmur</span>
    <span></span>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 24px;">
    <label class="a-search">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: none; stroke: var(--a-outline); stroke-width: 2; stroke-linecap: round;"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
      <input type="search" aria-label="Search dictionary" placeholder="Search">
    </label>
    <div class="a-card a-list" style="border-radius: 24px 24px 0 0; overflow: hidden;">
      <sc-for list="{{words}}" as="w" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 20px; font: 400 17px/24px var(--font-sans);">
          <sc-if value="{{w.heard}}" hint-placeholder-val="{{false}}"><span style="color: var(--a-ink-2);">{{w.heard}} →</span></sc-if>
          <span>{{w.word}}</span>
          <sc-if value="{{w.learned}}" hint-placeholder-val="{{false}}"><span aria-label="learned">✨</span></sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <button type="button" class="a-fab" aria-label="Add a word"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round;"><path d="M12 5v14M5 12h14"></path></svg></button>
  <dc-import name="AndroidNav" active="dictionary" hint-size="390px,76px" style="flex: none;"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const w = (word, heard, learned) => ({ word, heard: heard || '', learned: !!learned });
    return {
      words: [
        w('Hetzner', '', true), w('Lior'), w('Gal'), w('JSON', 'jason'), w('Wolt'),
        w('Tailscale', '', true), w('QuickTick'), w('Shekem'), w('Saji'), w('Parakeet')
      ]
    };
  }
}
</script>
</body>
</html>
