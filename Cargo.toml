[workspace]
resolver = "2"
members = ["crates/murmur-build-info", "crates/murmur-core", "crates/murmur-ffi", "crates/murmur-cli", "crates/murmur-llm", "crates/murmur-whisper", "crates/murmur-asr-sherpa", "crates/murmur-protocol", "crates/murmur-router", "crates/murmur-remote", "crates/murmur-server", "crates/murmur-contract-tests", "crates/murmur-cloud", "crates/murmur-replay"]

[workspace.package]
edition = "2021"
version = "1.2.0"
# All rights reserved (COPYRIGHT); no open-source licence (D80).
license-file = "COPYRIGHT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# whisper.cpp is unusably slow unoptimised; keep it fast in dev/test builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
