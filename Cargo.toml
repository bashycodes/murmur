[workspace]
resolver = "2"
members = ["crates/flow-core", "crates/flow-ffi", "crates/flow-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# whisper.cpp is unusably slow unoptimised; keep it fast in dev/test builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
