# Dated probe (2026-11-04): how much silence still reaches the ASR engine
# on real recordings, using murmur-core's own VAD / segmenter / meeting
# chunker. Standalone crate (own [workspace]) so it never joins the main
# build. Run on recordings kept OUTSIDE the repo; never commit audio.
[package]
name = "silence_check_2026_11_04"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
murmur-core = { path = "../../../../crates/murmur-core", features = ["wav"] }
hound = "3"
serde_json = "1"
