# flow-server config for the colleague bundle (tools/colleague-bundle.sh;
# install steps in the bundle's INSTALL.md). Full reference:
# crates/flow-server/dist/config.example.toml.
#
# Add this machine's LAN or VPN address; only loopback, private LAN and
# VPN addresses are accepted. Never make the port reachable from the internet.
bind = ["127.0.0.1:7313"]          # e.g. ["127.0.0.1:7313", "10.1.2.3:7313"]
token_file = "/etc/flow-server/token"  # flow-server gen-token --out /etc/flow-server/token
state_dir = "/var/lib/flow-server"     # keys.json, key usage, library hash cache
workers = 1            # dictations decoded at once; each holds its models (~1-2.5 GB RAM)
max_queue = 2
max_session_s = 1200

[model]
asr_engine = "parakeet"
asr_path = "/var/lib/flow-server/library/parakeet-tdt-0.6b-v2-int8"
threads = 4
lid_path = "/var/lib/flow-server/library/whisper-tiny-lid/ggml-tiny-q5_1.bin"   # detects Hebrew
# AI cleanup; delete this line if you did not unzip the cleanup model.
llm_path = "/var/lib/flow-server/library/qwen2.5-1.5b-instruct-q4_k_m/qwen2.5-1.5b-instruct-q4_k_m.gguf"
llm_lib = "/opt/flow-server/lib/libflow_llm.so"

# Hebrew dictations (the app's language set to Hebrew, or detected by lid_path).
[model.languages.he]
asr_backend = "sherpa_online"
asr_path = "/var/lib/flow-server/library/zipformer-he-int8"

[library]              # the models the apps can download from this server
dir = "/var/lib/flow-server/library"

[log]
level = "info"
log_text = false       # never log transcripts
