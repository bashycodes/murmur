[package]
name = "flow-windows"
version = "0.9.0"
edition = "2021"
description = "Windows shell (Tauri 2) of Murmur, the fully-local Wispr Flow clone"
license = "MIT"
publish = false

# Standalone workspace root (Tauri + Win32 deps stay out of the core
# workspace's lockfile); flow-core comes in as a path dependency.
[workspace]

# whisper.cpp is unusably slow unoptimised (same as the root workspace).
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[lib]
name = "flow_windows"
path = "src/lib.rs"

[[bin]]
name = "flow-windows"
path = "src/main.rs"
required-features = ["app"]

[features]
# Hybrid build (D17): on-device engine + self-hosted server.
#   client-only: --no-default-features --features local,app
#   server-only: --no-default-features --features remote,app
default = ["local", "remote", "tls", "cloud", "download"]
# On-device ASR ("client"): the FlowCoreAdapter local backend + whisper.
local = ["whisper"]
# The local backend without a native ASR engine: what the MSVC cross-check
# builds (whisper.cpp/sherpa can't cross-compile from Linux).
local-engine = []
# Real local ASR (whisper.cpp via flow-core). Separate from `app` because
# whisper-rs-sys' cmake/C++ build cannot cross-compile to MSVC from Linux:
# the Linux cross-check runs `--no-default-features --features app`.
whisper = ["local-engine", "flow-core/whisper"]
# Parakeet-TDT (D12) via sherpa-onnx: links sherpa-onnx-c-api + onnxruntime
# (SHERPA_ONNX_LIB_DIR at build time; the DLLs ship next to the exe).
parakeet = ["local-engine", "flow-core/parakeet"]
# Self-hosted flow-server over WebSocket ("server"): the only network code.
remote = ["dep:flow-remote"]
# wss:// to a server outside your LAN/VPN (rustls + ring). In the default
# build; separate so the Linux MSVC cross-check can leave ring's C out.
tls = ["remote", "flow-remote/tls"]
# Opt-in third-party cloud speech-to-text (D18, docs/cloud-stt.md): HTTPS
# (reqwest + rustls) to the provider the user configured. In the default
# (hybrid) build only; never in `local,app` (tools/check-build-matrix.sh).
cloud = ["dep:flow-cloud"]
# Speech-model downloader (D31): HTTPS to Hugging Face, only when the user
# presses Download for a catalogue model (src/model_download.rs). In the
# default (hybrid) build; never in `local,app` (no network code there).
download = ["dep:reqwest"]
# The Tauri shell (tray, overlay window, event loop). Off by default so the
# platform-independent logic can be built/tested on any host without webkit.
app = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# `llm` = only a libloading loader for the flow_llm plugin (llama.cpp lives
# in that separate DLL, docs/DECISIONS.md D10), so it is always on and
# cross-checks for MSVC like any pure-Rust crate.
flow-build-info = { path = "../../crates/flow-build-info" }
flow-core = { path = "../../crates/flow-core", features = ["llm"] }
# Local history (audio is never stored). `bundled` = no system sqlite needed.
# D17: every dictation goes through the router (no network code in it;
# the remote backend is injected by `remote`).
flow-router = { path = "../../crates/flow-router" }
flow-remote = { path = "../../crates/flow-remote", optional = true }
flow-cloud = { path = "../../crates/flow-cloud", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
# Model downloader (feature `download`, D31): same client stack as flow-cloud.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
# Pinned SHA-256 of downloaded models (pure Rust, no network).
sha2 = "0.10"
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Credentials",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[dev-dependencies]
hound = "3"
# tests/router_integration.rs: an in-process flow-server (MockAsr).
flow-server = { path = "../../crates/flow-server", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
# tests/cloud_integration.rs: flow-cloud's in-process mock provider.
flow-cloud = { path = "../../crates/flow-cloud", features = ["mock-server"] }
