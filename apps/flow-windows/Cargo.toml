[package]
name = "flow-windows"
version = "0.1.0"
edition = "2021"
description = "Windows shell (Tauri 2) of the fully-local Wispr Flow clone"
license = "MIT"
publish = false

# Standalone workspace root: keeps this crate buildable regardless of whether a
# repo-root workspace exists yet. When flow-core lands, either add this crate to
# the root workspace (and delete this table) or keep it standalone with a path dep.
[workspace]

[lib]
name = "flow_windows"
path = "src/lib.rs"

[[bin]]
name = "flow-windows"
path = "src/main.rs"
required-features = ["app"]

[features]
default = []
# The Tauri shell (tray, overlay window, event loop). Off by default so the
# platform-independent logic can be built/tested on any host without webkit.
app = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
