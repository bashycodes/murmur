<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Murmur Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header>
      <h1>Murmur</h1>
      <p class="sub" id="privacy_line">Everything runs on this PC. Nothing is sent over the network.</p>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="general">General</button>
        <button type="button" role="tab" data-tab="ai">AI cleanup</button>
        <button type="button" role="tab" data-tab="history">History</button>
        <button type="button" role="tab" data-tab="insights">Insights</button>
        <button type="button" role="tab" data-tab="dictionary">Dictionary <span id="sugg_badge" class="badge" hidden></span></button>
        <button type="button" role="tab" data-tab="openrouter" id="tab_openrouter" hidden>OpenRouter <span id="or_badge" class="badge" hidden>!</span></button>
        <button type="button" role="tab" data-tab="developer" id="tab_developer" hidden>Developer</button>
      </nav>
    </header>

    <form id="form">
      <div class="page-root" id="page_general"></div>
      <div class="page-root" id="page_ai"></div>
      <div class="page-root" id="page_style"></div>

      <footer><button type="submit">Save</button> <span id="status"></span></footer>
    </form>

    <div class="page-root" id="page_history"></div>
    <div class="page-root" id="page_insights"></div>
    <div class="page-root" id="page_dictionary"></div>
    <div class="page-root" id="page_openrouter"></div>
    <div class="page-root" id="page_developer"></div>

    <script type="module" src="settings.js"></script>
  </body>
</html>
