# flow-server config for the container image (docs/container.md).
# Reference for every key: crates/flow-server/dist/config.example.toml.
#
# Paths inside the container:
#   /models               models volume (read-only): ASR model dirs, GGUF,
#                         and library/ (models served to the apps, D40)
#   /var/lib/flow-server  state volume: keys.json, key-usage.json,
#                         library-hashes.json
#   /etc/flow-server      this file (+ cert.pem / key.pem for [tls])
#
# `bind` is replaced by the entrypoint with 127.0.0.1 + the container's own
# address unless FLOW_BIND_CONTAINER_IP=0. Used as written, 0.0.0.0 is
# refused unless [tls] is set or FLOW_INSECURE_BIND_ANY=1 (docs/container.md).
bind = ["0.0.0.0:7313"]
# No token_file: keys live in state_dir. Bootstrap the admin key with
#   docker compose exec flow-server flow-server keys add owner --admin
state_dir = "/var/lib/flow-server"
workers = 1
max_queue = 2

[model]
asr_engine = "parakeet"
asr_path = "/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
threads = 4
# AI cleanup (the image ships the llama.cpp plugin; FLOW_LLM_LIB points at it):
# llm_path = "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
# Spoken-language detection for [model.languages] routing (whisper ggml):
# lid_path = "/models/ggml-tiny-q5_1.bin"

# [model.languages.he]
# asr_backend = "sherpa_online"
# asr_path = "/models/zipformer2-66m-streaming-he-int8"

# [tls]                # wss://; then FLOW_INSECURE_BIND_ANY is not needed
# cert = "/etc/flow-server/tls/cert.pem"
# key = "/etc/flow-server/tls/key.pem"

[library]
dir = "/models/library"

[log]
level = "info"
log_text = false
