apiVersion: v1
kind: Service
metadata:
  name: {{ include "murmur-server.fullname" . }}
  labels:
    {{- include "murmur-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "murmur-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ if .Values.serverTls.enabled }}wss{{ else }}ws{{ end }}
      port: {{ .Values.service.port }}
      targetPort: murmur
      protocol: TCP
