{{- if and .Values.insecureBindAny .Values.serverTls.enabled }}
{{- fail "insecureBindAny and serverTls.enabled together: with [tls] the override is not needed" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "murmur-server.fullname" . }}
  labels:
    {{- include "murmur-server.labels" . | nindent 4 }}
spec:
  # One server per state volume: keys.json has a single writer, and each
  # replica would load its own models.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "murmur-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "murmur-server.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "murmur-server.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if and .Values.gpu.enabled .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: murmur-server
          image: {{ include "murmur-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            # The chart mounts its own config (not the image's config
            # generated from /models, D77).
            - name: MURMUR_CONFIG
              value: /etc/murmur-server/config.toml
            - name: MURMUR_BIND_CONTAINER_IP
              value: {{ ternary "1" "0" .Values.bindPodIP | quote }}
            - name: MURMUR_INSECURE_BIND_ANY
              value: {{ ternary "1" "0" .Values.insecureBindAny | quote }}
            - name: MURMUR_START_GRACE_S
              value: {{ .Values.startGraceSeconds | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: murmur
              containerPort: 7313
              protocol: TCP
          # /v1/health needs a key, so probes are TCP-level only. Liveness
          # (murmur-healthcheck) also passes while the entrypoint waits for the
          # first key and while the models load; readiness needs the port.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/murmur-healthcheck"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: murmur
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- $res := deepCopy .Values.resources }}
            {{- if .Values.gpu.enabled }}
            {{- $_ := set $res "limits" (merge (default (dict) $res.limits) (dict .Values.gpu.resourceName .Values.gpu.count)) }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/murmur-server/config.toml
              subPath: config.toml
              readOnly: true
            - name: models
              mountPath: /models
              readOnly: true
            - name: state
              mountPath: /var/lib/murmur-server
            - name: tmp
              mountPath: /tmp
            {{- if .Values.serverTls.enabled }}
            - name: tls
              mountPath: /etc/murmur-server/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "murmur-server.fullname" . }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.models.existingClaim | default (printf "%s-models" (include "murmur-server.fullname" .)) }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.state.existingClaim | default (printf "%s-state" (include "murmur-server.fullname" .)) }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- if .Values.serverTls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "serverTls.secretName is required with serverTls.enabled" .Values.serverTls.secretName }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
