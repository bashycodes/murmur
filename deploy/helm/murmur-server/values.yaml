# murmur-server Helm chart values (docs/container.md "Helm").

# Built locally and loaded into the node's container runtime (no registry):
#   docker build -f deploy/docker/Dockerfile -t murmur-server:local .
#   docker save murmur-server:local | <runtime import>   (docs/container.md)
image:
  repository: murmur-server
  tag: local
  # Never: the image must already be on the node.
  pullPolicy: Never

# NVIDIA GPU (LLM cleanup on CUDA). Needs the NVIDIA device plugin and
# the image built with `--target cuda`.
gpu:
  enabled: false
  image:
    repository: murmur-server
    tag: local-cuda
  resourceName: nvidia.com/gpu
  count: 1
  # e.g. "nvidia" when the cluster uses a RuntimeClass for the NVIDIA runtime
  runtimeClassName: ""

# Binding (docs/container.md "Binding"):
# bindPodIP: the entrypoint binds 127.0.0.1 + the pod IP instead of the
#   config's bind, so the server's loopback/LAN/VPN rules and peer filter
#   apply as on a host install (pod IPs are private).
# insecureBindAny: --insecure-bind-any (0.0.0.0 without TLS, no peer
#   filter). Only with bindPodIP false and no serverTls.
bindPodIP: true
insecureBindAny: false

# wss:// terminated by murmur-server itself (cert pinned in the apps):
# a kubernetes.io/tls Secret mounted at /etc/murmur-server/tls.
serverTls:
  enabled: false
  secretName: ""

service:
  type: ClusterIP
  port: 7313
  # For a LoadBalancer on a LAN: keep client IPs, so the peer filter sees them.
  externalTrafficPolicy: ""
  annotations: {}

# Optional Ingress (WebSocket at /v1/stream, plus /v1/health).
# TLS here terminates at the ingress controller; the hop to the pod is
# plain ws:// inside the cluster.
ingress:
  enabled: false
  className: ""
  host: murmur.example.lan
  annotations: {}
    # nginx: long-lived WebSocket sessions (sessions run up to 20 min)
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "1300"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "1300"
  tls:
    enabled: true
    secretName: murmur-server-tls

persistence:
  # ASR model dirs, GGUF, and library/ (models served to the apps, D40).
  # Mounted read-only at /models; fill it out of band (docs/container.md).
  models:
    existingClaim: ""
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  # keys.json, key-usage.json, library-hashes.json at /var/lib/murmur-server.
  state:
    existingClaim: ""
    size: 256Mi
    storageClass: ""
    accessModes: [ReadWriteOnce]

# config.toml (the ConfigMap). Reference:
# crates/murmur-server/dist/config.example.toml. With serverTls.enabled the
# chart appends the [tls] table; keep it out of here.
config: |
  # bind is replaced by 127.0.0.1 + the pod IP while bindPodIP is true.
  bind = ["0.0.0.0:7313"]
  state_dir = "/var/lib/murmur-server"
  workers = 1
  max_queue = 2

  [model]
  asr_engine = "parakeet"
  asr_path = "/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
  threads = 4
  # llm_path = "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  # lid_path = "/models/ggml-tiny-q5_1.bin"

  [library]
  dir = "/models/library"

  [log]
  level = "info"
  log_text = false

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 8Gi

# Seconds the liveness check allows for model loading after the server
# process starts (the listener binds only after the models are loaded).
startGraceSeconds: 600

extraEnv: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
