# murmur-server with Docker Compose (docs/server-setup.md). The same as the
# quick start's `docker run`, plus a restart policy and hardening. From the
# repo root:
#
#   MURMUR_MODELS_PATH=/path/to/models docker compose -f deploy/docker-compose.yml up -d --build
#   docker exec murmur-server cat /data/admin.token     # the admin key
#
# MURMUR_MODELS_PATH: a folder with one folder per model, each tagged by its
# model.toml (e.g. the colleague bundle's unzipped library/), mounted
# read-only at /models. The config is derived from it on every start;
# keys and the admin key live in the murmur_data volume.
# Commands: docker exec murmur-server murmur-server keys add phone
#
# Settings (environment or a .env file next to this one):
#   MURMUR_MODELS_PATH   the models folder on this machine (required)
#   MURMUR_STT / MURMUR_LLM / MURMUR_HEBREW / MURMUR_LID
#                      a model folder to use instead of the default pick, or none
#   MURMUR_PUBLISH_ADDR  host address the port is published on (default 0.0.0.0: every
#                      IPv4 address; the server's peer filter, loopback/LAN/VPN only,
#                      is then the only guard, and Docker-published ports bypass ufw).
#                      Set your LAN or VPN address on a host with a public address.
#   MURMUR_HOST_PORT     host port (default 7313)
#
# GPU (NVIDIA; LLM cleanup on the GPU), instead of the CPU service:
#   docker compose -f deploy/docker-compose.yml --profile gpu up -d --build murmur-server-gpu
name: murmur-server

x-server: &server
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  environment: &env
    MURMUR_STT: ${MURMUR_STT:-}
    MURMUR_LLM: ${MURMUR_LLM:-}
    MURMUR_HEBREW: ${MURMUR_HEBREW:-}
    MURMUR_LID: ${MURMUR_LID:-}
  ports:
    - "${MURMUR_PUBLISH_ADDR:-0.0.0.0}:${MURMUR_HOST_PORT:-7313}:7313"
  volumes:
    - ${MURMUR_MODELS_PATH:?set MURMUR_MODELS_PATH to your models folder}:/models:ro
    - murmur_data:/data
  # Parakeet ~1 GB, + Qwen2.5-1.5B ~1.5 GB, + LID; same cap as the systemd unit.
  mem_limit: 8g
  stop_grace_period: 20s

services:
  murmur-server:
    <<: *server
    container_name: murmur-server
    image: murmur-server
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: runtime

  murmur-server-gpu:
    <<: *server
    profiles: [gpu]
    container_name: murmur-server-gpu
    environment:
      <<: *env
      MURMUR_CONTAINER_NAME: murmur-server-gpu
    image: murmur-server:local-cuda
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  # admin.token, keys.json, key usage, library hashes. Survives `down`;
  # `down -v` deletes it (and with it every key).
  murmur_data:
