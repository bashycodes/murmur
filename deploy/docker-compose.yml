# flow-server with Docker Compose (docs/container.md). The same as the
# quick start's `docker run`, plus a restart policy and hardening:
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs -f    # the admin key, then "ready"
#
# Everything (config, keys, models) lives in the flow_data volume; the first
# start downloads the models (~1.9 GB with FLOW_MODELS=default).
# Commands: docker exec flow-server flow-server keys add phone
#
# Settings (environment or a .env file next to this one):
#   FLOW_IMAGE         image (default ghcr.io/bashycodes/murmur/flow-server:latest;
#                      flow-server:local after `docker compose build`)
#   FLOW_MODELS        default | english | none | model folder ids (docs/container.md)
#   FLOW_PUBLISH_ADDR  host address the port is published on (default 0.0.0.0: every
#                      address; the server still drops peers outside loopback/LAN/VPN).
#                      Set your LAN or VPN address on a host with a public address.
#   FLOW_HOST_PORT     host port (default 7313)
#
# GPU (NVIDIA; LLM cleanup on the GPU), instead of the CPU service, built locally:
#   docker compose -f deploy/docker-compose.yml --profile gpu up -d --build flow-server-gpu
name: flow-server

x-server: &server
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  environment:
    FLOW_MODELS: ${FLOW_MODELS:-default}
  ports:
    - "${FLOW_PUBLISH_ADDR:-0.0.0.0}:${FLOW_HOST_PORT:-7313}:7313"
  volumes:
    - flow_data:/data
  # Parakeet ~1 GB, + Qwen2.5-1.5B ~1.5 GB, + LID; same cap as the systemd unit.
  mem_limit: 8g
  stop_grace_period: 20s

services:
  flow-server:
    <<: *server
    container_name: flow-server
    image: ${FLOW_IMAGE:-ghcr.io/bashycodes/murmur/flow-server:latest}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: runtime

  flow-server-gpu:
    <<: *server
    profiles: [gpu]
    container_name: flow-server-gpu
    environment:
      FLOW_MODELS: ${FLOW_MODELS:-default}
      FLOW_CONTAINER_NAME: flow-server-gpu
    image: flow-server:local-cuda
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  # config.toml, admin.token, keys, library/ (models). Survives `down`;
  # `down -v` deletes it.
  flow_data:
