# flow-server with Docker Compose (docs/server-setup.md). The same as the
# quick start's `docker run`, plus a restart policy and hardening. From the
# repo root:
#
#   FLOW_MODELS_PATH=/path/to/models docker compose -f deploy/docker-compose.yml up -d --build
#   docker exec flow-server cat /data/admin.token     # the admin key
#
# FLOW_MODELS_PATH: a folder with one folder per model, each tagged by its
# model.toml (e.g. the colleague bundle's unzipped library/), mounted
# read-only at /models. The config is derived from it on every start;
# keys and the admin key live in the flow_data volume.
# Commands: docker exec flow-server flow-server keys add phone
#
# Settings (environment or a .env file next to this one):
#   FLOW_MODELS_PATH   the models folder on this machine (required)
#   FLOW_STT / FLOW_LLM / FLOW_HEBREW / FLOW_LID
#                      a model folder to use instead of the default pick, or none
#   FLOW_PUBLISH_ADDR  host address the port is published on (default 0.0.0.0: every
#                      IPv4 address; the server's peer filter, loopback/LAN/VPN only,
#                      is then the only guard, and Docker-published ports bypass ufw).
#                      Set your LAN or VPN address on a host with a public address.
#   FLOW_HOST_PORT     host port (default 7313)
#
# GPU (NVIDIA; LLM cleanup on the GPU), instead of the CPU service:
#   docker compose -f deploy/docker-compose.yml --profile gpu up -d --build flow-server-gpu
name: flow-server

x-server: &server
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  environment: &env
    FLOW_STT: ${FLOW_STT:-}
    FLOW_LLM: ${FLOW_LLM:-}
    FLOW_HEBREW: ${FLOW_HEBREW:-}
    FLOW_LID: ${FLOW_LID:-}
  ports:
    - "${FLOW_PUBLISH_ADDR:-0.0.0.0}:${FLOW_HOST_PORT:-7313}:7313"
  volumes:
    - ${FLOW_MODELS_PATH:?set FLOW_MODELS_PATH to your models folder}:/models:ro
    - flow_data:/data
  # Parakeet ~1 GB, + Qwen2.5-1.5B ~1.5 GB, + LID; same cap as the systemd unit.
  mem_limit: 8g
  stop_grace_period: 20s

services:
  flow-server:
    <<: *server
    container_name: flow-server
    image: flow-server
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: runtime

  flow-server-gpu:
    <<: *server
    profiles: [gpu]
    container_name: flow-server-gpu
    environment:
      <<: *env
      FLOW_CONTAINER_NAME: flow-server-gpu
    image: flow-server:local-cuda
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  # admin.token, keys.json, key usage, library hashes. Survives `down`;
  # `down -v` deletes it (and with it every key).
  flow_data:
